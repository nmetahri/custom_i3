# Fichier de configuration des thèmes i3
# Ce fichier charge le thème actif depuis un lien symbolique

# Initialiser automatiquement le thème au premier démarrage (par défaut: Gruvbox)
exec_always --no-startup-id sh -c '\
	if [ ! -L ~/.config/i3/colors-active.conf ]; then \
		rm -f ~/.config/i3/colors-active.conf; \
		ln -s ~/.config/i3/themes/6-gruvbox.conf ~/.config/i3/colors-active.conf; \
	fi; \
	~/.config/i3/scripts/generate-bar.sh'

# Charger la barre générée dynamiquement
include ~/.config/i3/bar-generated.conf

# Raccourci pour changer de thème
bindsym $mod+Shift+t exec --no-startup-id ~/.config/i3/scripts/change-theme.sh

